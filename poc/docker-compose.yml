version: '3.8'

services:
  chat-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chat-server
    ports:
      - "8080:8080"
    networks:
      - chat-network

  chat-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: chat-client
    stdin_open: true
    tty: true
    depends_on:
      - chat-server
    networks:
      - chat-network
    entrypoint: ["java", "-jar", "app.jar", "--cli", "chat-server", "8080"]

networks:
  chat-network:
    driver: bridge

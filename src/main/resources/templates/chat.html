<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Corporativo - Chat da Federação</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: rgba(22, 30, 46, 0.8);
            --bg-header: rgba(15, 23, 42, 0.9);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .navbar {
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar-title { font-size: 1.1rem; font-weight: 700; color: #fff; }

        .identity-badge {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn-logout:hover { background: rgba(239, 68, 68, 0.4); }

        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
        }

        .sidebar {
            width: 320px;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 20px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .user-item, .group-item {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .user-item:hover, .group-item:hover { background: rgba(99, 102, 241, 0.15); }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(15, 23, 42, 0.4);
        }

        .chat-feed {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            max-width: 80%;
            align-self: flex-start;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .message-card.outgoing {
            background: rgba(99, 102, 241, 0.25);
            border-color: rgba(99, 102, 241, 0.4);
            align-self: flex-end;
        }

        .message-card.error-card {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
            align-self: center;
            max-width: 90%;
        }

        .msg-meta {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .msg-sender { font-weight: 700; color: #818cf8; }
        .msg-clock { font-family: monospace; font-size: 0.7rem; color: #94a3b8; }
        .msg-body { font-size: 0.95rem; line-height: 1.4; color: #fff; word-break: break-word; }

        .chat-input-bar {
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-row { display: flex; gap: 10px; }

        .form-input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }
        .form-input:focus { border-color: var(--primary); }

        .btn-send {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-send:hover { background: var(--primary-hover); }

        .btn-file {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .create-group-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
        }
        .create-group-box input, .create-group-box select {
            width: 100%;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="navbar-brand">
        <span class="navbar-title">Federação Corporativa SD</span>
        <span class="identity-badge" th:text="${userId}">exec-mt-pedro</span>
    </div>
    <div>
        <a th:href="@{/logout}" class="btn-logout">Sair da Sessão</a>
    </div>
</div>

<div class="app-container">
    <!-- Sidebar Left -->
    <div class="sidebar">
        <div>
            <div class="section-title">Usuários Cadastrados Online</div>
            <div th:each="user : ${onlineUsers}">
                <div class="user-item" th:data-user="${user}" onclick="selectTarget(this.getAttribute('data-user'), false)">
                    <span th:text="${user}">exec-mt-pedro</span>
                    <span class="status-dot"></span>
                </div>
            </div>
        </div>

        <div>
            <div class="section-title">Grupos da Federação</div>
            <div th:each="grp : ${groups}">
                <div class="group-item" th:data-grp="${grp}" onclick="selectGroupTarget(this.getAttribute('data-grp'))">
                    <span th:text="${grp}">grp-federal</span>
                    <span style="font-size: 0.7rem; color: #818cf8;">[GRUPO]</span>
                </div>
            </div>
        </div>

        <div class="create-group-box">
            <div class="section-title">Criar Novo Grupo</div>
            <form th:action="@{/create-group}" method="post">
                <input type="text" name="groupId" class="form-input" placeholder="ID (ex: grp-crise)" required>
                <input type="text" name="groupName" class="form-input" placeholder="Nome do Grupo" required>
                <select name="restrictedPoder" class="form-input">
                    <option value="all">Acesso: Todos os Poderes</option>
                    <option value="exec">Restrito: Executivo</option>
                    <option value="jud">Restrito: Judiciário</option>
                    <option value="leg">Restrito: Legislativo</option>
                </select>
                <label style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 8px;">
                    <input type="checkbox" name="adminOnly" value="true"> Somente Admin Fala
                </label>
                <button type="submit" class="btn-send" style="width: 100%;">Criar Grupo</button>
            </form>
        </div>
    </div>

    <!-- Main Chat Feed Area -->
    <div class="chat-area">
        <div class="chat-feed" id="chatFeed">
            <div th:each="msg : ${messages}">
                <div th:class="${msg.type == 'ERROR' ? 'message-card error-card' : (msg.senderId == userId ? 'message-card outgoing' : 'message-card')}">
                    <div class="msg-meta">
                        <span class="msg-sender" th:text="${msg.senderId}">remetente</span>
                        <span>➔ Para: <strong th:text="${msg.targetId}">destinatario</strong></span>
                        <span class="msg-clock" th:text="${'VC: ' + msg.vectorClock}">VC</span>
                    </div>
                    <div class="msg-body" th:text="${msg.content}">Conteúdo da mensagem...</div>
                    <div th:if="${msg.authentic}" style="font-size: 0.65rem; color: var(--success); margin-top: 4px;">Assinatura Digital HMAC Válida ✅</div>
                </div>
            </div>
        </div>

        <!-- Chat Input Bar -->
        <div class="chat-input-bar">
            <!-- Envio de Texto -->
            <form th:action="@{/send-msg}" method="post" class="input-row">
                <input type="text" id="targetId" name="targetId" class="form-input" style="width: 200px;" placeholder="Destinatário (ID ou grp-)" required>
                <input type="hidden" id="isGroup" name="isGroup" value="false">
                <input type="text" name="content" class="form-input" style="flex: 1;" placeholder="Digite sua mensagem corporativa..." required autocomplete="off">
                <button type="submit" class="btn-send">Enviar ➔</button>
            </form>

            <!-- Envio de Arquivos -->
            <form th:action="@{/send-file}" method="post" enctype="multipart/form-data" class="input-row">
                <input type="text" id="fileTargetId" name="targetId" class="form-input" style="width: 200px;" placeholder="Destinatário do Arquivo" required>
                <input type="file" name="file" class="form-input" style="flex: 1;" required>
                <button type="submit" class="btn-file">Enviar Arquivo 📁</button>
            </form>
        </div>
    </div>
</div>

<script>
    function selectTarget(userId, isGroup) {
        if (!userId) return;
        document.getElementById('targetId').value = userId;
        document.getElementById('fileTargetId').value = userId;
        document.getElementById('isGroup').value = isGroup;
    }

    function selectGroupTarget(grpString) {
        if (!grpString) return;
        var grpId = grpString.split(' - ')[0];
        document.getElementById('targetId').value = grpId;
        document.getElementById('fileTargetId').value = grpId;
        document.getElementById('isGroup').value = 'true';
    }

    // Scroll automático para o final do feed
    var chatFeed = document.getElementById('chatFeed');
    if (chatFeed) {
        chatFeed.scrollTop = chatFeed.scrollHeight;
    }

    // Auto-refresh do feed a cada 3 segundos
    setInterval(function() {
        fetch('/chat')
            .then(function(response) { return response.text(); })
            .then(function(html) {
                var parser = new DOMParser();
                var doc = parser.parseFromString(html, 'text/html');
                var newFeed = doc.getElementById('chatFeed');
                if (newFeed && document.getElementById('chatFeed')) {
                    document.getElementById('chatFeed').innerHTML = newFeed.innerHTML;
                }
            })
            .catch(function(err) {});
    }, 3000);
</script>

</body>
</html>
